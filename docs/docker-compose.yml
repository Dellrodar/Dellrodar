# Local preview of the ePortfolio site.
# Run from the docs/ folder:  docker compose up
# First run pulls ruby:3.3 and installs gems; later runs reuse vendor/bundle.
# Site serves at http://localhost:4000/Dellrodar/
# Page edits livereload automatically, but Jekyll never reloads _config.yml —
# after config changes run:  docker compose restart site
services:
  site:
    image: ruby:3.3
    working_dir: /site
    command: bash -c "bundle install && bundle exec jekyll serve --host 0.0.0.0 --force_polling --livereload"
    environment:
      BUNDLE_PATH: /site/vendor/bundle
    ports:
      - "4000:4000"
      - "35729:35729"
    volumes:
      - .:/site
